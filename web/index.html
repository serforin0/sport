<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HubSport — red social deportiva para atletas, entrenadores y reclutadores. Regístrate, conecta y encuentra oportunidades.">
  <meta name="theme-color" content="#0F172A">
  <meta property="og:title" content="HubSport">
  <meta property="og:description" content="Conecta con el ecosistema deportivo: perfiles scout, eventos, empleos y comunidad.">
  <meta property="og:type" content="website">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HubSport">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HubSport</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #0F172A; color: #fff; font-family: system-ui, sans-serif; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; z-index: 9999;
      background: linear-gradient(180deg, #0F172A 0%, #0B1224 100%);
    }
    #splash h1 { margin: 0; font-size: 2rem; letter-spacing: 0.08em; }
    #splash h1 span { color: #64A6FF; }
    #splash p { margin: 0; color: #94A3B8; max-width: 28rem; text-align: center; padding: 0 1rem; }
    #splash .cta { margin-top: 8px; color: #3B82F6; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="splash">
    <h1>HUB<span>SPORT</span></h1>
    <p>Red deportiva para atletas, coaches y reclutadores. Cargando la app…</p>
    <p class="cta">Registro · Inicio de sesión · Comunidad</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
