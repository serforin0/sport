name: Flutter CI

on:
  pull_request:
  push:
    branches: [main, master, ultimos-cambios/fixer]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/features/demo lib/features/settings/presentation/pages/invoices_page.dart test/features/demo
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --coverage
      - name: Enforce 80% line coverage (demo data/domain)
        run: |
          python3 - <<'PY'
          lines = open("coverage/lcov.info").read().splitlines()
          source = None
          found = hit = total_found = total_hit = 0

          def in_demo(path: str) -> bool:
              return "/features/demo/" in path

          def in_gate(path: str) -> bool:
              return "/features/demo/data/" in path or "/features/demo/domain/" in path

          for line in lines:
              if line.startswith("SF:"):
                  source = line[3:]
              elif line.startswith("LF:") and source and in_demo(source):
                  n = int(line[3:])
                  total_found += n
                  if in_gate(source):
                      found += n
              elif line.startswith("LH:") and source and in_demo(source):
                  n = int(line[3:])
                  total_hit += n
                  if in_gate(source):
                      hit += n
          coverage = 100 * hit / found if found else 0
          overall = 100 * total_hit / total_found if total_found else 0
          print(f"Demo data/domain coverage: {coverage:.2f}% ({hit}/{found})")
          print(f"Demo overall (info): {overall:.2f}% ({total_hit}/{total_found})")
          raise SystemExit(0 if coverage >= 80 else 1)
          PY
      - run: flutter build apk --release --dart-define=ENABLE_DEMO_LOGIN=true
      - uses: actions/upload-artifact@v4
        with:
          name: hubsport-demo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
